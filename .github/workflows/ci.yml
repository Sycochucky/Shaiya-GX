name: GX Windows and Linux
on:
  push:
    branches: [main]
    tags: ['gx-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify geometry rebuild for the release tag
        if: startsWith(github.ref, 'refs/tags/gx-v')
        env:
          GX_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 --force origin "$GITHUB_REF:$GITHUB_REF"
          python3 tools/release_geometry.py --verify-tag "$GX_TAG"
      - name: Release packaging checks
        env:
          PYTHONPATH: tools
        run: python3 -m unittest test_release_geometry test_package_bundle
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - name: Server Wiki source reference freshness
        run: python3 tools/generate_server_reference.py --check
      - name: Reachable server and transport vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./server/internal/... ./server/cmd/gx_login ./server/cmd/gx_world ./internal/transport ./internal/netx ./internal/session
      - name: Infrastructure concurrency
        run: go test -race ./server/internal/filelock ./server/internal/netx ./server/internal/session ./server/internal/password ./server/internal/db ./server/internal/scheduler ./server/internal/controlplane ./server/internal/logx ./server/internal/admin ./internal/authwire ./internal/transport
      - name: Fetch verified server physics
        run: python3 tools/fetch_server_geometry.py
      - name: Transaction and loot concurrency
        run: go test -race -tags integration ./server/internal/world -run 'TestAudit|TestTrade|TestQuestRollback|TestGuildLifecycle|TestConcurrentGoldPickup|TestInventoryOperationRollback' -count=1 -timeout=180s
      - name: Durable trade and quest protocol concurrency
        run: go test -race -tags integration ./server/cmd/gx_world -run '^(TestTradeDurableBeforeAckAndDisconnectAgainstSQLite|TestQuestWriteFailureRetryAndDurableAckAgainstSQLite)$' -count=1 -timeout=300s
      - name: Credential parser fuzz smoke
        run: go test ./internal/authwire -run '^$' -fuzz FuzzCredentialDecode -fuzztime 10s
      - name: Frame parser fuzz smoke
        run: go test ./server/internal/netx -run '^$' -fuzz FuzzFrames -fuzztime 10s
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: ${{ runner.os != 'Windows' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Storage tools on the native OS
        shell: bash
        run: python -m unittest discover -s server/tools -p 'test_*.py'
      - uses: actions/cache/restore@v4
        if: runner.os == 'Windows'
        id: windows-cache
        with:
          key: gx-windows-go-1.27.4-${{ hashFiles('go.sum') }}
          path: |
            ~/AppData/Local/go-build
            ~/go/pkg/mod
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libasound2-dev
      - name: Build and unit test (Linux)
        if: runner.os == 'Linux'
        run: ./tools/build.sh
      - name: Build and unit test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build.ps1
      - name: Start the Windows client process
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & '.\build\Shaiya GX.exe' -help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path '.\build\logs\client.log' -Pattern 'platform=windows/amd64' -Quiet)) {
            throw 'The Windows client did not reach startup diagnostics.'
          }
          if (-not (Select-String -Path '.\build\logs\client.log' -Pattern 'System OS="Windows [^"]+" CPU="[^"]+" logical_cpus=[1-9][0-9]* physical_ram="[1-9][0-9]* MiB"' -Quiet)) {
            throw 'The Windows client did not record system specifications and physical RAM.'
          }
      - name: Validate external fonts and Unicode coverage
        shell: bash
        env:
          SHAIYA_DATA: ${{ github.workspace }}/resources
        run: |
          python tools/font_pack.py
          go test ./internal/ui -run '^TestExternalFontLazyCoverageAndEmojiClusters$' -count=1
      - name: Package client with fonts, without game artwork
        shell: bash
        run: python tools/package_client.py --platform '${{ matrix.platform }}' --output out/client
      - uses: actions/upload-artifact@v4
        with:
          name: gx-client-${{ matrix.platform }}
          path: |
            out/client/*.tar.gz
            out/client/*.zip
          if-no-files-found: error
      - name: Fetch verified server physics
        shell: bash
        run: python tools/fetch_server_geometry.py
      - name: Server integration and storage tools
        shell: bash
        run: |
          go test -tags integration ./server/... -count=1
          python tools/check_publication.py --history
      - name: Build portable and verify native startup
        shell: bash
        run: python server/tools/package.py --platform '${{ matrix.platform }}' --gui --output out/portable
      - uses: actions/upload-artifact@v4
        with:
          name: gx-server-${{ matrix.platform }}
          path: out/portable/*
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always() && runner.os == 'Windows' && steps.windows-cache.outcome == 'success' && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          key: gx-windows-go-1.27.4-${{ hashFiles('go.sum') }}
          path: |
            ~/AppData/Local/go-build
            ~/go/pkg/mod
  release:
    if: startsWith(github.ref, 'refs/tags/gx-v')
    needs: [native, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: portable
      - name: Publish GX client and server portables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GX_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 --force origin "$GITHUB_REF:$GITHUB_REF"
          mkdir release
          cp portable/gx-client-linux-amd64/*.tar.gz release/
          cp portable/gx-client-windows-amd64/*.zip release/
          cp portable/gx-server-linux-amd64/*.tar.gz release/
          cp portable/gx-server-windows-amd64/*.zip release/
          (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
          python3 tools/package_release.py --archives release --tag "$GX_TAG"
          notes=(--notes "")
          if [[ -f "docs/releases/$GX_TAG.md" ]]; then
            notes=(--notes-file "docs/releases/$GX_TAG.md")
          fi
          gh release create "$GX_TAG" release/* --verify-tag --title "Shaiya GX $GX_TAG" "${notes[@]}" --latest
